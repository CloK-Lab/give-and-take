name = "give-and-take"
version = "0.1.0"
defaultTargets = ["GiveAndTake", "demo"]

[leanOptions]
warningAsError = true

[[lean_lib]]
name = "GiveAndTake"
# Include every module's checks without importing fixtures into the library facade.
globs = ["GiveAndTake.*"]

[[lean_exe]]
name = "demo"
root = "Main"
